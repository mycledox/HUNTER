spring.application.name=hunter-api
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/hunter;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
hunter.storage.directory=${HUNTER_STORAGE_DIR:./data/uploads}
hunter.azure.openai.endpoint=${HUNTER_AZURE_OPENAI_ENDPOINT:}
hunter.azure.openai.key=${HUNTER_AZURE_OPENAI_KEY:}
hunter.azure.openai.deployment=${HUNTER_AZURE_OPENAI_DEPLOYMENT:}
hunter.local-ocr.executable=${HUNTER_TESSERACT_PATH:tesseract}
hunter.local-ocr.languages=${HUNTER_TESSERACT_LANGUAGES:eng}
